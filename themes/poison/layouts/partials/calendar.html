<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<div id="calendar"></div>

<br>
<a class="cal-button" href="/ical/calendar_events.ical">Import Calendar</a>
<button class="cal-button cal-primary" onclick="hidePastEvents()">Hide Past Events</button>

<script>
    /*
    {{- $events := where .Site.RegularPages "Section" "events" -}}
    {{- $clean := slice -}}
    {{- range $events }}
        {{- $clean = $clean | append (dict
            "title" .Title
            "date" (.Date.Format "2006-01-02")
            "url" .RelPermalink
        ) -}}
    {{- end }}
    */

    const eventsJson = JSON.parse('{{ $clean | jsonify }}');

    document.addEventListener('DOMContentLoaded', async function () {
        const data = eventsJson;

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            events: data.map(e => ({
                title: e.title,
                start: e.date,
                url: e.url
            }))
        });

        calendar.render();
    });

    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    const filtered = data.filter(e => {
        const d = new Date(e.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
    });
</script>

<script>
    function hidePastEvents() {
        let articles = document.getElementsByClassName("history-parent");
        for (let i = 0; i < articles.length; i++) {
            let a = articles[i];

            let timeString = a.getAttribute("time");
            let today = new Date();
            today.setDate(today.getDate() - 1);

            if (Date.parse(timeString) < today) {
                a.setAttribute("hidden", true);
            }
        }
    }
</script>

<style>
    a[class~="fc-col-header-cell-cushion"] {
        color: #808080;
    }

    div[class="fc-daygrid-day-top"]>a {
        color: #808080
    }

    a[class~="fc-event"]>div>div>div>div {
        color: white !important;
    }

    a[class~="fc-event"] {
        background-color: #ea2128;
        border: #ea2128;
    }

    div[aria-labelledby~="fc-dom-1"] {
        height: 32rem !important;
    }

    td>div>div[class~="fc-scroller"] {
        overflow: hidden !important;
    }

    .cal-button {
        background-color: slategray;
        color: white;
        padding: 2rem;
        border: 1px solid transparent;
        border-radius: 0.25em;
        display: inline-block;
        font-size: 1em;
        font-weight: 400;
        line-height: 1.5;
        padding: 0.4em 0.65em;
        text-align: center;
        user-select: none;
        vertical-align: middle;
    }

    .cal-primary {
        background-color: #2c3e50;
    }
</style>
